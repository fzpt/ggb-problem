<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>立体几何原型（JSXGraph 3D）</title>
<link rel="stylesheet" href="/jxg/vendor/jsxgraph.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f2f5; }
  .topbar { background: #1a56db; color: #fff; padding: 10px 18px; }
  .topbar h1 { margin: 0; font-size: 18px; }
  .topbar .sub { font-size: 12px; opacity: .85; margin-top: 3px; }
  .main { display: flex; gap: 14px; padding: 14px 18px; align-items: flex-start; }
  .left { flex: 0 0 720px; background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .right { flex: 1; background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); min-width: 320px; }
  .toolbar { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  .toolbar button { padding: 5px 10px; border: 1px solid #d0d7de; background: #f6f8fa; border-radius: 5px; cursor: pointer; font-size: 13px; }
  .toolbar button:hover { background: #eaeef2; }
  #board { width: 696px; height: 560px; border: 1px solid #d0d7de; border-radius: 6px; }
  #hint { font-size: 12px; color: #57606a; margin-top: 6px; }
  .panel h2 { font-size: 14px; margin: 10px 0 6px; }
  #steps { width: 100%; height: 300px; font-family: Consolas, monospace; font-size: 12px; border: 1px solid #d0d7de; border-radius: 6px; padding: 8px; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .row button { padding: 6px 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; background: #1a56db; color: #fff; }
  .row button.secondary { background: #57606a; }
  .examples button { background: #f6f8fa; color: #24292f; border: 1px solid #d0d7de; }
  #status { font-size: 12px; margin-top: 8px; color: #1a7f37; min-height: 16px; }
  .schema { font-size: 12px; color: #57606a; background: #f6f8fa; border-radius: 6px; padding: 8px 10px; margin-top: 10px; line-height: 1.7; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="topbar">
  <h1>立体几何原型（JSXGraph 3D · 技术验证）</h1>
  <div class="sub">左侧：3D 画板（拖拽旋转视角） | 右侧：构造步骤 JSON 驱动渲染（后续对接 AI 生成）</div>
</div>
<div class="main">
  <div class="left">
    <div class="toolbar">
      <button data-example="pyramid">三棱锥</button>
      <button data-example="cuboid">立方体</button>
      <button data-example="sphere">球+截面圆</button>
      <button data-example="combo">正四棱锥组合</button>
    </div>
    <div id="board"></div>
    <div id="hint">拖拽 = 水平旋转视角；Shift+拖拽 = 俯仰；滚轮 = 缩放。画板内容由右侧步骤 JSON 渲染。</div>
  </div>
  <div class="right panel">
    <h2>构造步骤 JSON（可手改）</h2>
    <textarea id="steps" spellcheck="false"></textarea>
    <div class="row">
      <button id="renderBtn">渲染到画板</button>
      <button id="copyBtn" class="secondary">复制 JSON</button>
    </div>
    <div id="status"></div>
    <div class="schema" id="schemaDoc"></div>
  </div>
</div>
<script src="/jxg/vendor/jsxgraphcore.js"></script>
<script src="./jxg3d.js"></script>
</body>
</html>
